name: Linux x64 and HIP RX 7900 artifacts

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        description: Artifacts to build
        default: all
        options: [all, linux, hip]

permissions:
  contents: read

jobs:
  linux:
    name: Linux x64 AppImage and Terminal
    if: inputs.target != 'hip'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/host/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Inkling serving
        run: |
          python -m pip install -r terminal/requirements.txt
          python -m unittest discover -s terminal/serve -p 'test_inkling*.py'
      - name: Build and stage Terminal
        run: |
          python tools/packaging/package_terminal.py --out dist --target linux-x86_64
          python app/desktop/scripts/stage-control.py --archive dist/strata-terminal-*-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: strata-terminal-linux-x86_64
          path: dist/strata-terminal-*
          if-no-files-found: error
      - name: Install AppImage build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 patchelf squashfs-tools rsync gstreamer1.0-plugins-good
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build and verify AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          # Harness is an external build input. Reuse the matching release's staged bundle.
          release="$RUNNER_TEMP/upstream.AppImage"
          curl -fsSL --retry 3 https://github.com/Niko1221/Strata/releases/download/v0.2.20/Strata-0.2.20-linux-x86_64.AppImage -o "$release"
          echo "10cc4a0ac5fd6f4d46e7108147e98ae5d4e818bd666f08e20a17daab439f011d  $release" | sha256sum -c -
          chmod +x "$release"
          unsquashfs -no-progress -o "$("$release" --appimage-offset)" -d "$RUNNER_TEMP/upstream-app" "$release" 'usr/lib/*/harness'
          harness=$(find "$RUNNER_TEMP/upstream-app/usr/lib" -type d -name harness -print -quit)
          test -n "$harness"
          mkdir -p app/desktop/src-tauri/resources/{harness,engine-bundle}
          cp -a "$harness/." app/desktop/src-tauri/resources/harness/
          app/desktop/scripts/fetch-node.sh --target linux-x64
          npm ci --prefix app/host
          npm --prefix app/host run build
          (cd app/desktop && npx --yes @tauri-apps/cli@2.12.4 build --bundles appimage -- --locked)
          input=$(find app/desktop/src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)
          version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' app/desktop/src-tauri/Cargo.toml | head -n 1)
          output="dist/Strata-$version-linux-x86_64.AppImage"
          bash app/desktop/scripts/repack-appimage.sh "$input" "$output"
          bash app/desktop/scripts/repack-appimage.sh "$output" "$output" --check
      - uses: actions/upload-artifact@v4
        with:
          name: strata-app-linux-x86_64
          path: dist/*.AppImage*
          if-no-files-found: error

  hip:
    name: HIP RX 7900 / ${{ matrix.component }}
    if: inputs.target != 'linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container: rocm/dev-ubuntu-24.04:7.2.4-complete
    strategy:
      fail-fast: false
      matrix:
        component: [engine, inkling]
    defaults:
      run:
        shell: bash
    steps:
      - name: Install packaging tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git cmake ninja-build patchelf pigz python3 python3-cryptography
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build RX 7900 packages
        env:
          HP: /opt/rocm
          VARIANT: rx7900
          OUT: ${{ github.workspace }}/build-rx7900
          COMMIT: ${{ github.sha }}
          COMPONENT: ${{ matrix.component }}
        run: |
          JOBS=2
          export JOBS
          export PKGVER=$(sed -n 's/^project(strata VERSION \([0-9.]*\).*/\1/p' engine/CMakeLists.txt | head -n 1)
          if [[ ! -d "$HP/lib/llvm/amdgcn/bitcode" ]]; then
            mkdir -p "$HP/lib/llvm/amdgcn"
            ln -s "$HP/amdgcn/bitcode" "$HP/lib/llvm/amdgcn/bitcode"
          fi
          stage="$OUT/stage"
          shape=()
          if [[ "$COMPONENT" == inkling ]]; then
            export ROCM_PATH="$HP"
            cmake -G Ninja -S engine -B "$OUT/b" -DCMAKE_BUILD_TYPE=Release -DSTRATA_ENABLE_HIP=ON \
              -DSTRATA_ENABLE_CUDA=OFF -DSTRATA_BUILD_TESTS=OFF -DSTRATA_PORTABLE=ON \
              '-DCMAKE_HIP_ARCHITECTURES=gfx1100;gfx1101;gfx1102' -DSTRATA_INK_HIP_EXTRA_FLAGS=-fPIC \
              -DCMAKE_HIP_COMPILER="$HP/llvm/bin/clang++" -DCMAKE_HIP_COMPILER_ROCM_ROOT="$HP" -DCMAKE_PREFIX_PATH="$HP"
            cmake --build "$OUT/b" --target strata-inkling -j "$JOBS"
            mkdir -p "$stage"
            cp "$OUT/b/src/inkling2/strata-inkling" "$stage/"
            python3 tools/packaging/collect_libs.py --binary "$stage/strata-inkling" --search "$HP/lib" --search "$HP/lib/llvm/lib" --out "$stage" --also 'libamd_comgr.so*' --also 'libhiprtc*.so*'
            patchelf --set-rpath '$ORIGIN' "$stage/strata-inkling"
            shape=(--shape inkling2)
          elif ! NO_PACKAGE=1 bash tools/packaging/build_hip_linux.sh; then
            tail -n 35 "$OUT"/*.log "$OUT/build.status"
            exit 1
          fi
          # The distribution ROCm image links these from the OS. The packages carry them for clean hosts.
          mkdir -p "$stage/licenses"
          for entry in libz.so.1:zlib1g libzstd.so.1:libzstd1 libdrm.so.2:libdrm2 libelf.so.1:libelf1t64 libnuma.so.1:libnuma1 libgomp.so.1:libgomp1; do
            lib=${entry%:*}
            cp -L "/usr/lib/x86_64-linux-gnu/$lib" "$stage/$lib"
            cp "/usr/share/doc/${entry#*:}/copyright" "$stage/licenses/$lib.txt"
          done
          for lib in "$stage"/*.so*; do
            patchelf --set-rpath '$ORIGIN' "$lib"
          done
          python3 tools/packaging/package_engine.py --src "$stage" --backend hip --version "$PKGVER" \
            --out "$OUT/packages" --variant "$VARIANT" "${shape[@]}" --tree \
            --arch gfx1100 --arch gfx1101 --arch gfx1102 --build-id "$COMMIT+rocm"
          mkdir -p dist
          for package in "$OUT/packages"/*/; do
            python3 tools/packaging/package_engine.py --verify "$package"
            python3 tools/packaging/binary_deps.py "$package"
            STRATA_PACK_THREADS=2 python3 tools/packaging/feed_tool.py pack-engine "$package" --out dist
          done
      - uses: actions/upload-artifact@v4
        with:
          name: strata-hip-rx7900-${{ matrix.component }}
          path: dist/*
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: strata-hip-rx7900-${{ matrix.component }}-logs
          path: |
            build-rx7900/*.log
            build-rx7900/build.status
